services:
  # Rust HTTP server (core-engine)
  rust-server:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: intellishell-rust-server
    ports:
      - "3000:3000"
    volumes:
      # Persist database
      - ./data:/app/data
    environment:
      - RUST_LOG=info
      - AI_SERVICE_URL=http://ai-service:8000
      - DATABASE_PATH=/app/data/intellishell.db
    depends_on:
      - ai-service
    networks:
      - intellishell-network
    restart: unless-stopped

  # Python AI service
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: intellishell-ai-service
    ports:
      - "8000:8000"
    volumes:
      # Persist database
      - ./data:/app/data
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DATABASE_PATH=/app/data/intellishell.db
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - intellishell-network
    restart: unless-stopped
    # Allow access to host's Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  intellishell-network:
    driver: bridge

volumes:
  data:

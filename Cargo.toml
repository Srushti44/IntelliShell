[workspace]
members = [
    "core-engine",
    "crates/telemetry",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
authors = ["IntelliShell Contributors"]
license = "MIT"

[workspace.dependencies]
# Shared dependencies across workspace
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
